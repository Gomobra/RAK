name: Sweep

on:
  workflow_dispatch:
    inputs:
      neurons:
        description: "Neuron eksitasi"
        required: false
        default: "100"
      batches:
        description: "Jumlah batch per konfigurasi"
        required: false
        default: "40"
      strengths:
        description: "Nilai inhibition_strength yang dicoba (pisah koma)"
        required: false
        default: "0,1,2,4,8,16"
      eta:
        description: "Learning rate STDP"
        required: false
        default: "1e-3"

# Tidak ada trigger `push` — hanya saat diminta.

concurrency:
  group: sweep-${{ github.ref }}

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-v1

      - name: Sweep inhibition strength
        run: |
          python scripts/sweep_inhibition.py \
            --neurons ${{ github.event.inputs.neurons || '100' }} \
            --batches ${{ github.event.inputs.batches || '40' }} \
            --strengths "${{ github.event.inputs.strengths || '0,1,2,4,8,16' }}" \
            --eta ${{ github.event.inputs.eta || '1e-3' }}

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rak-sweep-${{ github.run_number }}
          path: runs/sweep/
          retention-days: 30

      - name: Commit sweep report
        if: always() && hashFiles('runs/sweep/sweep.md') != ''
        run: |
          mkdir -p experiments/exp_004_sweep
          cp runs/sweep/sweep.md runs/sweep/sweep.json experiments/exp_004_sweep/ 2>/dev/null || true
          git config user.name "rak-ci"
          git config user.email "rak-ci@users.noreply.github.com"
          git add experiments/exp_004_sweep/ || true
          git diff --cached --quiet || git commit -q -m "exp_004: sweep inhibition_strength (run ${{ github.run_number }})"
          git push || echo "push gagal, ada di artifact"