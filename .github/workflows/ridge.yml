name: Ridge readout

# Readout linear di atas spike count, memakai bobot hasil training
# yang SUDAH ADA. Tidak ada training ulang. Label hanya dipakai untuk
# fitting readout di data TRAIN; test diukur sekali.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID yang artifact-nya berisi weights.pt"
        required: true
      run_id_2:
        description: "Opsional: run ID kedua (fitur digabung jadi ensemble)"
        required: false
        default: ""
      run_id_3:
        description: "Opsional: run ID ketiga"
        required: false
        default: ""
      run_id_4:
        description: "Opsional: run ID keempat"
        required: false
        default: ""
      run_id_5:
        description: "Opsional: run ID kelima"
        required: false
        default: ""
      train_samples:
        description: "Jumlah gambar TRAIN untuk fit+validasi readout"
        required: false
        default: "5000"
      test_samples:
        description: "Jumlah gambar TEST"
        required: false
        default: "10000"
      trials:
        description: "Presentasi Poisson per gambar"
        required: false
        default: "5"
      inhibition:
        description: "inhibition_strength saat training"
        required: false
        default: "1600"
      e_to_i:
        description: "e_to_i_strength saat training (checkpoint lama tidak menyimpannya)"
        required: false
        default: "1600"
      rest_ms:
        description: "rest_ms saat training"
        required: false
        default: "0"
      legacy_params:
        description: "Pakai parameter lama (sparse inhibisi)"
        required: false
        default: "false"

jobs:
  ridge:
    runs-on: ubuntu-latest
    # Ensemble 5 model x 15k gambar x 5 trials bisa ~2.5 jam.
    # Timeout 90 menit pernah membunuh job tepat di 1h30m dan
    # menghasilkan artifact kosong.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . --quiet

      - name: Ambil bobot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.inputs.run_id }} -D runs/ridge/a
          if [ -n "${{ github.event.inputs.run_id_2 }}" ]; then
            gh run download ${{ github.event.inputs.run_id_2 }} -D runs/ridge/b
          fi
          if [ -n "${{ github.event.inputs.run_id_3 }}" ]; then
            gh run download ${{ github.event.inputs.run_id_3 }} -D runs/ridge/c
          fi
          if [ -n "${{ github.event.inputs.run_id_4 }}" ]; then
            gh run download ${{ github.event.inputs.run_id_4 }} -D runs/ridge/d
          fi
          if [ -n "${{ github.event.inputs.run_id_5 }}" ]; then
            gh run download ${{ github.event.inputs.run_id_5 }} -D runs/ridge/e
          fi
          find runs/ridge -name weights.pt -not -path "*smoke*"

      - name: Fit readout
        run: |
          set -o pipefail
          W=$(find runs/ridge/a -name weights.pt -not -path "*smoke*" | head -1)
          EXTRA=""
          if [ -n "${{ github.event.inputs.run_id_2 }}" ]; then
            W2=$(find runs/ridge/b -name weights.pt -not -path "*smoke*" | head -1)
            EXTRA="$W2"
          fi
          if [ -n "${{ github.event.inputs.run_id_3 }}" ]; then
            W3=$(find runs/ridge/c -name weights.pt -not -path "*smoke*" | head -1)
            EXTRA="$EXTRA $W3"
          fi
          if [ -n "${{ github.event.inputs.run_id_4 }}" ]; then
            W4=$(find runs/ridge/d -name weights.pt -not -path "*smoke*" | head -1)
            EXTRA="$EXTRA $W4"
          fi
          if [ -n "${{ github.event.inputs.run_id_5 }}" ]; then
            W5=$(find runs/ridge/e -name weights.pt -not -path "*smoke*" | head -1)
            EXTRA="$EXTRA $W5"
          fi
          python scripts/ridge_readout.py \
            --weights "$W" $EXTRA \
            --train-samples ${{ github.event.inputs.train_samples }} \
            --test-samples ${{ github.event.inputs.test_samples }} \
            --trials ${{ github.event.inputs.trials }} \
            --inhibition ${{ github.event.inputs.inhibition }} \
            --e-to-i ${{ github.event.inputs.e_to_i || '1600' }} \
            --rest-ms ${{ github.event.inputs.rest_ms || '0' }} \
            ${{ github.event.inputs.legacy_params == 'true' && '--legacy-params' || '' }} \
            --out runs/ridge/ridge.json | tee runs/ridge/ridge.txt

      - name: Ringkasan
        if: always()
        run: cat runs/ridge/ridge.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rak-ridge-${{ github.run_number }}
          path: runs/ridge/
          retention-days: 30
