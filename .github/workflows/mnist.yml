name: MNIST

on:
  workflow_dispatch:
    inputs:
      neurons:
        description: "Jumlah neuron eksitasi"
        required: false
        default: "400"
      epochs:
        description: "Jumlah epoch"
        required: false
        default: "1"
      seed:
        description: "Seed"
        required: false
        default: "1"
      inhibition:
        description: "I->E weight per synapse (acuan 17)"
        required: false
        default: "17"
      theta_plus:
        description: "theta_plus (acuan 0.05)"
        required: false
        default: "0.05"
      theta_max:
        description: "Batas atas theta (mV)"
        required: false
        default: "200"
      delay_max:
        description: "Delay input->E maksimum (ms), acuan 10"
        required: false
        default: "0"
      rest_ms:
        description: "Jeda zero-input (ms), acuan 150"
        required: false
        default: "0"
      legacy_params:
        description: "Pakai parameter lama (sparse inhibisi)"
        required: false
        default: "false"
      assign:
        description: "Jumlah gambar train untuk assignment"
        required: false
        default: "5000"
      test:
        description: "Jumlah gambar test (0 = 10000)"
        required: false
        default: "0"
      trials:
        description: "Presentasi per gambar test"
        required: false
        default: "1"
      smoke:
        description: "Jalankan smoke test dulu"
        type: boolean
        required: false
        default: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[tasks]" --quiet
      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-v1
      - name: Train + evaluate
        run: |
          python scripts/run_mnist.py \
            --neurons ${{ github.event.inputs.neurons || '400' }} \
            --epochs ${{ github.event.inputs.epochs || '1' }} \
            --seed ${{ github.event.inputs.seed || '1' }} \
            --inhibition ${{ github.event.inputs.inhibition || '17' }} \
            --theta-plus ${{ github.event.inputs.theta_plus || '0.05' }} \
            --theta-max ${{ github.event.inputs.theta_max || '200' }} \
            --delay-max ${{ github.event.inputs.delay_max || '0' }} \
            --rest-ms ${{ github.event.inputs.rest_ms || '0' }} \
            ${{ github.event.inputs.legacy_params == 'true' && '--legacy-params' || '' }} \
            --assign-samples ${{ github.event.inputs.assign || '5000' }} \
            --test-limit ${{ github.event.inputs.test || '0' }} \
            --trials ${{ github.event.inputs.trials || '1' }} \
            ${{ github.event.inputs.smoke == 'false' && '--no-smoke' || '' }}
      - name: Upload weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rak-mnist-${{ github.event.inputs.neurons || '400' }}n-${{ github.run_number }}
          path: runs/mnist/
          retention-days: 30