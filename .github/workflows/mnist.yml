name: MNIST

on:
  workflow_dispatch:
    inputs:
      neurons:
        description: "Jumlah neuron eksitasi"
        required: false
        default: "100"
      epochs:
        description: "Jumlah epoch atas training set"
        required: false
        default: "1"
      seed:
        description: "Seed inisialisasi bobot dan sampling Poisson"
        required: false
        default: "1"
      eta:
        description: "Learning rate STDP"
        required: false
        default: "1e-3"
      inhibition:
        description: "Total konduktansi inhibitor per neuron eksitasi"
        required: false
        default: "800"
      rule:
        description: "Rule STDP (eq3 atau variant3)"
        required: false
        default: "variant3"
      limit:
        description: "Batas presentasi (0 = penuh 60000)"
        required: false
        default: "0"
      assign:
        description: "Jumlah gambar train untuk assignment kelas (0 = 10000)"
        required: false
        default: "0"
      test:
        description: "Jumlah gambar test untuk evaluasi (0 = 10000)"
        required: false
        default: "0"
      continue_epochs:
        description: "Dengan resume_run: lanjutkan training N epoch lagi (0 = evaluasi saja)"
        required: false
        default: "0"
      trials:
        description: "Jumlah presentasi per gambar test (default 1)"
        required: false
        default: "1"
      theta_plus:
        description: "theta_plus (acuan 0.05; 0.0125 mengunci laju 4x lebih tinggi)"
        required: false
        default: "0.0125"
      theta_max:
        description: "Batas atas theta (mV)"
        required: false
        default: "40"
      e_to_i:
        description: "Bobot E->I (satu-satu)"
        required: false
        default: "1600"
      reassign:
        description: "Dengan resume_run: hitung ulang assignment (STDP mati), jangan pakai yang tersimpan"
        type: boolean
        required: false
        default: false
      resume_run:
        description: "Run ID yang checkpoint-nya mau dievaluasi/dilanjutkan (kosong = training baru)"
        required: false
        default: ""
      smoke:
        description: "Jalankan smoke test dulu"
        type: boolean
        required: false
        default: true
      gate:
        description: "Gagal kalau akurasi di bawah ini (0 = tanpa gate)"
        required: false
        default: "0"
# CATATAN: TIDAK ada trigger `push` di sini, hanya workflow_dispatch.
# Versi pertama punya `on: push`, dan setiap commit ke path src/rak/
# langsung menyalakan run 3 jam tanpa diminta. Sekarang hanya jalan
# kalau diminta.

permissions:
  actions: read
  contents: write

concurrency:
  group: mnist-${{ github.ref }}
  cancel-in-progress: false   # JANGAN cancel — run panjang kills sia-sia

env:
  # PyTorch di runner: set thread eksplisit supaya tidak oversubscribe.
  # Runner GitHub punya 2 vCPU; default torch akan spawn 2 thread per
  # op dan saling berebut.
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  train:
    runs-on: ubuntu-latest
    # Batas keras. Default GitHub 6 jam; run 400 neuron bisa makan lebih.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache MNIST
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-v1

      - name: Ambil checkpoint dari run sebelumnya
        if: ${{ github.event.inputs.resume_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.inputs.resume_run }} -D runs/resume
          find runs/resume -name checkpoint.pt -o -name weights.pt

      - name: Train + evaluate
        env:
          RESUME_RUN: ${{ github.event.inputs.resume_run }}
        run: |
          RESUME_ARG=""
          if [ -n "$RESUME_RUN" ]; then
            # Artifact berisi model utama DAN model smoke (100
            # neuron). Tanpa filter, `find | head -1` bisa memilih
            # smoke/weights.pt dan seluruh evaluasi jadi model 100
            # neuron.
            CKPT=$(find runs/resume -name checkpoint.pt -not -path "*smoke*" | head -1)
            WEIGHTS=$(find runs/resume -name weights.pt -not -path "*smoke*" | head -1)
            # weights.pt = model FINAL. checkpoint.pt = snapshot
            # terakhir (bisa di tengah epoch). Evaluasi harus memakai
            # yang final; checkpoint hanya cadangan.
            if [ -n "$WEIGHTS" ]; then
              RESUME_ARG="--resume $WEIGHTS"
            elif [ -n "$CKPT" ]; then
              RESUME_ARG="--resume $CKPT"
            fi
            echo "resume arg: $RESUME_ARG"
          fi

          python scripts/run_mnist.py \
            --neurons ${{ github.event.inputs.neurons || '100' }} \
            --epochs ${{ github.event.inputs.epochs || '1' }} \
            --seed ${{ github.event.inputs.seed || '1' }} \
            --eta ${{ github.event.inputs.eta || '1e-3' }} \
            --limit ${{ github.event.inputs.limit || '0' }} \
            --inhibition ${{ github.event.inputs.inhibition || '800' }} \
            --trials ${{ github.event.inputs.trials || '1' }} \
            --theta-plus ${{ github.event.inputs.theta_plus || '0.0125' }} \
            --theta-max ${{ github.event.inputs.theta_max || '40' }} \
            --e-to-i ${{ github.event.inputs.e_to_i || '1600' }} \
            --rule ${{ github.event.inputs.rule || 'variant3' }} \
            --assign-samples ${{ github.event.inputs.assign || '0' }} \
            --test-limit ${{ github.event.inputs.test || '0' }} \
            --gate ${{ github.event.inputs.gate || '0' }} \
            --continue-epochs ${{ github.event.inputs.continue_epochs || '0' }} \
            ${{ github.event.inputs.reassign == 'true' && '--reassign' || '' }} \
            $RESUME_ARG \
            ${{ github.event.inputs.smoke == 'false' && '--no-smoke' || '' }}

      - name: Upload weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rak-mnist-${{ github.event.inputs.neurons || '100' }}n-${{ github.run_number }}
          path: runs/mnist/
          retention-days: 30

      - name: Commit report
        if: always() && hashFiles('runs/mnist/report.json') != ''
        run: |
          mkdir -p experiments/exp_003_mnist
          cp runs/mnist/report.json experiments/exp_003_mnist/ 2>/dev/null || true
          cp runs/mnist/history.json experiments/exp_003_mnist/ 2>/dev/null || true
          git config user.name "rak-ci"
          git config user.email "rak-ci@users.noreply.github.com"
          git add experiments/exp_003_mnist/ || true
          git diff --cached --quiet || git commit -q -m "exp_003: laporan MNIST (run ${{ github.run_number }})"
          git push || echo "push gagal (branch protections), laporan tetap ada di artifact"