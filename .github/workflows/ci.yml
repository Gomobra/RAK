name: CI RAK (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ clang python3 python3-dev python3-pip
          python3 -m pip install --upgrade pip pybind11 pytest

      - name: Configure CMake (CPU, tests + bench + python ON)
        run: cmake -B build -S . \
          -DRAK_CUDA=OFF \
          -DRAK_BUILD_TESTS=ON \
          -DRAK_BUILD_BENCH=ON \
          -DRAK_BUILD_PYTHON=ON \
          -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build -j$(nproc)

      - name: Run C++ tests (Catch2)
        run: ./build/cpp/rak_tests

      - name: Run benchmark and save report
        run: |
          mkdir -p experiments/reports
          ./build/cpp/rak_bench | tee experiments/reports/bench_report_ci.txt

      - name: Run Python tests (smoke + parity)
        run: |
          export PYTHONPATH=build/cpp/python:$PYTHONPATH
          python3 -m pytest tests/ -v --timeout=60

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: experiments/reports/bench_report_ci.txt
          retention-days: 7
