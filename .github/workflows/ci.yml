name: CI RAK (CPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ clang python3 python3-dev python3-pip
          python3 -m pip install --upgrade pip pybind11 pytest

      - name: Configure CMake (CPU, RAK_CUDA=OFF)
        run: cmake -B build -S . -DRAK_CUDA=OFF -DRAK_BUILD_TESTS=OFF -DRAK_BUILD_BENCH=OFF -DRAK_BUILD_PYTHON=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run Python smoke tests
        run: |
          export PYTHONPATH=build/cpp/python:$PYTHONPATH
          python3 -m pytest tests/ -v
