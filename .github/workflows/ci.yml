name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Termux (lokasi dev) jalan di 3.14 dengan torch via apt. Codespaces
        # dan CI pakai pip. Kita uji yang standar saja — kalau ada yang hanya
        # jalan di Termux, itu bug portabilitas, bukan fitur.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Selfcheck
        run: python -m rak selfcheck

      - name: Test
        run: pytest

  # Scan CJK nyasar. Kita nulis docstring dalam bahasa Indonesia, dan
  # beberapa kali ada karakter Mandarin yang nyelip dari input IME —
  # subtle, dan cukup merusak kalau masuk ke docstring yang jadi
  # dokumentasi.
  lint-cjk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No stray CJK characters
        run: |
          if grep -rlP '[\x{4e00}-\x{9fff}\x{3040}-\x{30ff}]' \
               --include='*.py' --include='*.md' . ; then
            echo "::error::CJK characters found in source or docs"
            exit 1
          fi
          echo "clean"